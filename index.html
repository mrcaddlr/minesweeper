<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Minesweeper</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3B7DED">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{ --radius: 14px; font-size: 16px; }

  /* ---- Theme seeds ---- */
  [data-theme="light"]{
    --bg-solid:#E9ECF2; --accent:#3B7DED; --text:#1E222B; --muted:#6B7686;
    --n1:#3B7DED; --n2:#1F9E5C; --n3:#E0392C; --n4:#7B4FE0; --n5:#9C3B22; --n6:#0E9C93; --n8:#5F6B7D;
    --danger:#E0392C; --flag-color:#F0A93B;
  }
  [data-theme="dark"]{
    --bg-solid:#14161C; --accent:#6FA1FF; --text:#E7E9EE; --muted:#8B93A3;
    --n1:#6FA1FF; --n2:#4FD08A; --n3:#FF6E63; --n4:#B48CFF; --n5:#E6926A; --n6:#3FD8CC; --n8:#9BA3B3;
    --danger:#FF6E63; --flag-color:#F2B84F;
  }
  [data-theme="catppuccin-latte"]{
    --bg-solid:#EFF1F5; --accent:#8839EF; --text:#4C4F69; --muted:#6C6F85;
    --n1:#1E66F5; --n2:#40A02B; --n3:#D20F39; --n4:#8839EF; --n5:#FE640B; --n6:#179299; --n8:#8C8FA1;
    --danger:#D20F39; --flag-color:#DF8E1D;
  }
  [data-theme="catppuccin-frappe"]{
    --bg-solid:#303446; --accent:#CA9EE6; --text:#C6D0F5; --muted:#949CBB;
    --n1:#8CAAEE; --n2:#A6D189; --n3:#E78284; --n4:#CA9EE6; --n5:#EF9F76; --n6:#81C8BE; --n8:#A5ADCE;
    --danger:#E78284; --flag-color:#E5C890;
  }
  [data-theme="catppuccin-macchiato"]{
    --bg-solid:#24273A; --accent:#C6A0F6; --text:#CAD3F5; --muted:#939AB7;
    --n1:#8AADF4; --n2:#A6DA95; --n3:#ED8796; --n4:#C6A0F6; --n5:#F5A97F; --n6:#8BD5CA; --n8:#A5ADCB;
    --danger:#ED8796; --flag-color:#EED49F;
  }
  [data-theme="catppuccin-mocha"]{
    --bg-solid:#1E1E2E; --accent:#CBA6F7; --text:#CDD6F4; --muted:#9399B2;
    --n1:#89B4FA; --n2:#A6E3A1; --n3:#F38BA8; --n4:#CBA6F7; --n5:#FAB387; --n6:#94E2D5; --n8:#B4BEFE;
    --danger:#F38BA8; --flag-color:#F9E2AF;
  }
  [data-theme="m3"]{
    --bg-solid:#F4EEF9; --accent:#6750A4; --text:#211C29; --muted:#5D5568;
    --n1:#4C5FD5; --n2:#28925A; --n3:#C6372F; --n4:#8A45B0; --n5:#8C4322; --n6:#0C8A81; --n8:#65596F;
    --danger:#C6372F; --flag-color:#E7A63C;
    --radius:22px;
  }
  [data-theme="custom"]{
    --bg-solid:#232634; --accent:#5CC8A5; --text:#EDEFF4; --muted:#9098AC;
    --n1:#5CC8A5; --n2:#79D06C; --n3:#F0685E; --n4:#B08CE0; --n5:#E0A05C; --n6:#4FBDD6; --n8:#9AA3B8;
    --danger:#F0685E; --flag-color:#E0B94A;
  }
  [data-theme="glass"]{
    --bg-solid:#0A0E1A; --accent:#9DB8FF; --text:#F1F4FF; --muted:#AAB4D8;
    --n1:#8FB8FF; --n2:#8EE3B8; --n3:#FF9C9C; --n4:#C9A8FF; --n5:#FFBD8F; --n6:#7FE0D0; --n8:#C7CCE3;
    --danger:#FF7A7A; --flag-color:#FFD27A;
  }
  html{ --n7: var(--text); --face-ink: var(--text); }

  /* ---- Derived surfaces (auto from seeds) ---- */
  :root, [data-theme]{
    --panel: color-mix(in srgb, var(--bg-solid) 90%, white 10%);
    --card:  color-mix(in srgb, var(--bg-solid) 78%, white 22%);
    --cell-hi: color-mix(in srgb, var(--card) 78%, white 22%);
    --cell-lo: color-mix(in srgb, var(--card) 78%, black 22%);
    --cell-revealed-bg: color-mix(in srgb, var(--card) 90%, white 10%);
    --led-top: color-mix(in srgb, var(--bg-solid) 55%, black 45%);
    --led-bottom: color-mix(in srgb, var(--bg-solid) 30%, black 70%);
  }
  html.is-dark{
    --cell-hi: color-mix(in srgb, var(--card) 65%, white 35%);
    --cell-lo: color-mix(in srgb, var(--card) 65%, black 35%);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{ height:100%; margin:0; }
  body{
    background: radial-gradient(1100px 700px at 50% -12%, color-mix(in srgb, var(--bg-solid) 60%, white 40%) 0%, var(--bg-solid) 60%);
    font-family: "Google Sans", "Segoe UI", Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    color: var(--text); overflow: hidden; touch-action: none; user-select: none;
    transition: background .3s ease, color .3s ease;
  }
  #app{
    position:absolute; top:50%; left:50%;
    width: calc(100vw - 24px); max-width: calc((100vw - 24px) / var(--ui-scale, 1));
    max-height: calc((100vh - 24px) / var(--ui-scale, 1));
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 9px; padding: 8px;
    transform: translate(-50%, -50%) scale(var(--ui-scale, 1)); transform-origin:center center; transition: transform .15s ease;
    overflow-y:auto; overflow-x:hidden; box-sizing:border-box;
  }
  #sidePanel{ display:flex; flex-direction:column; align-items:center; gap:9px; flex:none; width:100%; }
  #playArea{ display:flex; flex-direction:column; align-items:center; gap:9px; flex:none; }

  /* On wide-enough screens, move all the controls into a side column so a large
     board never has to compete with them for vertical space. */
  @media (min-width: 860px) and (min-aspect-ratio: 4/5){
    #app{ flex-direction:row; align-items:center; justify-content:center; gap:24px; }
    #sidePanel{ align-items:flex-start; max-height:94vh; overflow-y:auto; padding:2px 8px 2px 2px; }
    #sidePanel .titlebar{ width:100%; }
    #sidePanel .controls{ justify-content:flex-start; max-width:280px; }
    #sidePanel .ctrl-block{ align-items:flex-start; width:100%; }
    #sidePanel .chip-group{ justify-content:flex-start; }
    #sidePanel .panel-pop{ justify-content:flex-start; }
  }

  /* Compact mode: on phones every pixel of chrome is a pixel not spent on the
     board, so shrink the header/controls/hint text and let chip rows scroll
     horizontally instead of wrapping onto extra lines. */
  @media (max-width: 640px){
    #app{ gap:5px; padding:5px; }
    .titlebar{ gap:6px; }
    .titlebar svg.brand{ width:18px; height:18px; }
    .titlebar h1{ font-size:15px; }
    .icon-btn{ width:27px; height:27px; }
    .icon-btn svg{ width:14px; height:14px; }
    .controls{ gap:5px; }
    .ctrl-block{ gap:2px; }
    .ctrl-label{ font-size:8px; }
    .chip-group{
      padding:3px; gap:2px; flex-wrap:nowrap; justify-content:flex-start;
      max-width:94vw; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
    }
    .chip-group::-webkit-scrollbar{ display:none; }
    .chip{ padding:5px 8px; font-size:10px; gap:3px; }
    .chip svg{ width:11px; height:11px; }
    .panel-pop{ font-size:9.5px; padding:5px 7px; gap:4px; max-width:94vw; }
    .panel-pop input[type=number]{ width:40px; font-size:10.5px; }
    .below-board{ gap:4px; margin-top:2px; }
    .footer-hint{ font-size:9px; max-width:90vw; line-height:1.35; }
    .restart-btn{ padding:6px 13px; font-size:11.5px; }
    .led-label{ font-size:8px; }
  }

  .titlebar{ display:flex; align-items:center; gap:10px; }
  .titlebar svg.brand{ width:22px; height:22px; color:var(--accent); }
  .titlebar h1{ margin:0; font-size: clamp(17px, 3vw, 23px); font-weight:700; letter-spacing:.2px; }
  .icon-btn{
    width:32px; height:32px; border-radius:50%; border:none; cursor:pointer; background:var(--panel);
    color:var(--text); display:flex; align-items:center; justify-content:center; box-shadow: 0 1px 3px rgba(0,0,0,.15);
    transition: transform .12s ease, background .15s ease;
  }
  .icon-btn svg{ width:17px; height:17px; }
  .icon-btn:hover{ background:var(--card); }
  .icon-btn:active{ transform: scale(.92); }

  .ctrl-block{ display:flex; flex-direction:column; align-items:center; gap:4px; }
  .ctrl-label{ font-size:10px; font-weight:700; letter-spacing:.6px; color:var(--muted); text-transform:uppercase; }
  .controls{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:flex-end; max-width: 760px; }

  .chip-group{ display:flex; gap:3px; background:var(--panel); padding:4px; border-radius:999px; box-shadow: inset 0 1px 3px rgba(0,0,0,.15); flex-wrap:wrap; justify-content:center; }
  .chip{
    border:none; background:transparent; color:var(--muted); font-family:inherit; font-weight:600; font-size:12px;
    padding:6.5px 12px; border-radius:999px; cursor:pointer; display:flex; align-items:center; gap:5px;
    transition: background .18s ease, color .18s ease, transform .12s ease; white-space:nowrap;
  }
  .chip svg{ width:14px; height:14px; }
  .chip:hover{ color:var(--text); }
  .chip.active{ background: var(--card); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .chip:active{ transform: scale(.94); }
  /* Multi-row chip groups look clipped with a full pill radius, so use a softer radius */
  .modal-section .chip-group{ border-radius: 16px; justify-content:flex-start; }
  .modal-section .chip{ border-radius: 10px; }
  .modal-section .chip.active{ border-radius: 10px; }

  input[type=range]{ accent-color: var(--accent); width:100%; height:4px; }

  .panel-pop{
    display:none; align-items:center; gap:6px; background:var(--panel); padding:6px 10px; border-radius:12px;
    font-size:11px; color:var(--muted); font-weight:600; box-shadow: inset 0 1px 3px rgba(0,0,0,.15); flex-wrap:wrap; justify-content:center;
  }
  .panel-pop.show{ display:flex; }
  .panel-pop label{ display:flex; align-items:center; gap:5px; }
  .panel-pop input[type=number]{
    width:52px; padding:4px 5px; border-radius:7px; border:1px solid color-mix(in srgb, var(--muted) 40%, transparent);
    background: var(--card); color:var(--text); font-family:inherit; font-size:12px; font-weight:700;
  }
  .panel-pop input[type=color]{ width:26px; height:26px; padding:0; border:none; border-radius:7px; background:none; cursor:pointer; }
  .panel-pop button{
    border:none; background:var(--accent); color:#fff; font-family:inherit; font-weight:700; font-size:11.5px;
    padding:6px 12px; border-radius:8px; cursor:pointer;
  }
  .panel-pop button:active{ transform: scale(.95); }

  .card{ background: var(--panel); border-radius: var(--radius); padding: calc(12px * var(--ui-elem-scale, 1)); box-shadow: 0 10px 30px rgba(0,0,0,.28); transition: border-radius .3s ease, padding .15s ease; }
  .hud{ display:flex; align-items:center; justify-content:space-between; gap: 10px; margin-bottom: calc(10px * var(--ui-elem-scale, 1)); padding: 0 2px; }
  .led-block{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .led-label{ font-size:9px; font-weight:700; letter-spacing:.6px; color:var(--muted); text-transform:uppercase; }
  .led{
    background: linear-gradient(180deg, var(--led-top), var(--led-bottom)); border-radius: 10px;
    padding: calc(6px * var(--ui-elem-scale, 1)) calc(10px * var(--ui-elem-scale, 1));
    box-shadow: inset 0 2px 5px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.06);
    display:flex; align-items:center; gap:6px; min-width: calc(66px * var(--ui-elem-scale, 1)); justify-content:center;
    transition: padding .15s ease;
  }
  .led-digits{
    font-family: "Courier New", monospace; font-weight:700; font-size: calc(21px * var(--ui-elem-scale, 1)); letter-spacing: 2px; color: var(--accent);
    text-shadow: 0 0 6px color-mix(in srgb, var(--accent) 70%, transparent), 0 0 14px color-mix(in srgb, var(--accent) 40%, transparent);
    line-height:1; transition: font-size .15s ease;
  }
  .smiley-btn{
    width:calc(44px * var(--ui-elem-scale, 1)); height:calc(44px * var(--ui-elem-scale, 1)); border-radius:50%; border: none; cursor:pointer; background: var(--flag-color);
    box-shadow: 0 4px 14px rgba(0,0,0,.2), inset 0 -3px 6px rgba(0,0,0,.14), inset 0 2px 3px rgba(255,255,255,.45);
    display:flex; align-items:center; justify-content:center; transition: transform .1s ease, width .15s ease, height .15s ease; flex:none; padding:0;
  }
  .smiley-btn svg{ width:calc(26px * var(--ui-elem-scale, 1)); height:calc(26px * var(--ui-elem-scale, 1)); }
  .smiley-btn:active{ transform: scale(.9); }
  .smiley-btn.pulse{ animation: pop .35s ease; }
  @keyframes pop{ 0%{transform:scale(1)} 40%{transform:scale(1.18)} 100%{transform:scale(1)} }

  .board-wrap{
    position:relative; border-radius: 6px; overflow:hidden;
    box-shadow: inset 0 2px 6px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.06);
    background: var(--card); touch-action:none;
  }
  #board{ display:grid; position:relative; z-index:1; gap:1px; background: color-mix(in srgb, var(--card) 70%, black 10%); }
  #particles{ position:absolute; inset:0; pointer-events:none; z-index:5; }
  .board-wrap.shake{ animation: shake .45s ease; }
  @keyframes shake{
    10%,90%{ transform: translate3d(-1px,0,0);} 20%,80%{ transform: translate3d(2px,0,0);}
    30%,50%,70%{ transform: translate3d(-4px,0,0);} 40%,60%{ transform: translate3d(4px,0,0);}
  }

  .cell{
    position:relative; display:flex; align-items:center; justify-content:center; cursor:pointer;
    background: linear-gradient(145deg, var(--cell-hi), var(--card));
    box-shadow: inset 1px 1px 2px rgba(255,255,255,.35), inset -1px -1px 2px rgba(0,0,0,.25);
    transition: transform .06s ease, box-shadow .12s ease, background .15s ease, border-radius .25s ease;
  }
  #board.shape-square .cell{ border-radius: 2px; }
  #board.shape-circle .cell{ border-radius: 50%; }
  #board.shape-squircle .cell{ border-radius: 30%; }
  .cell svg{ width:60%; height:60%; }
  .cell.hidden:hover{ filter: brightness(1.05); }
  .cell.hidden:active{ transform: scale(.93); }
  .cell.revealed{ background: var(--cell-revealed-bg); box-shadow: inset 1px 1px 2px rgba(0,0,0,.18); cursor:default; animation: reveal-pop .16s ease; }
  @keyframes reveal-pop{ 0%{ transform: scale(.75); opacity:.3; } 100%{ transform: scale(1); opacity:1; } }
  .cell.flagged{ animation: flag-pop .22s cubic-bezier(.34,1.56,.64,1); }
  @keyframes flag-pop{ 0%{ transform: scale(.5) rotate(-15deg);} 70%{ transform: scale(1.2) rotate(6deg);} 100%{ transform: scale(1) rotate(0);} }
  .cell.mine-hit{ background: var(--danger) !important; box-shadow: inset 1px 1px 2px rgba(0,0,0,.3); }
  .cell.mine-hit svg{ color:#fff; }
  .cell.wrong-flag::after{
    content:""; position:absolute; inset:18%; border-radius:2px;
    background:
      linear-gradient(45deg, transparent 46%, var(--danger) 46%, var(--danger) 54%, transparent 54%),
      linear-gradient(-45deg, transparent 46%, var(--danger) 46%, var(--danger) 54%, transparent 54%);
  }

  .num{ font-family: "Google Sans", "Segoe UI Semibold", "Segoe UI", Roboto, Arial, sans-serif; font-weight:700; font-variant-numeric: tabular-nums; letter-spacing:0; }
  .num.n1{color:var(--n1)} .num.n2{color:var(--n2)} .num.n3{color:var(--n3)}
  .num.n4{color:var(--n4)} .num.n5{color:var(--n5)} .num.n6{color:var(--n6)}
  .num.n7{color:var(--n7)} .num.n8{color:var(--n8)}

  .below-board{ display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:4px; }
  .footer-hint{ font-size:11px; color:var(--muted); text-align:center; max-width:460px; line-height:1.5; }
  .restart-btn{
    display:none; align-items:center; gap:7px; border:none; background:var(--accent); color:#fff; font-family:inherit;
    font-weight:700; font-size:13px; padding:9px 18px; border-radius:999px; cursor:pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,.25); animation: rise .25s ease;
  }
  .restart-btn.show{ display:flex; }
  .restart-btn svg{ width:15px; height:15px; }
  .restart-btn:active{ transform: scale(.95); }
  @keyframes rise{ 0%{ opacity:0; transform: translateY(6px);} 100%{ opacity:1; transform: translateY(0);} }

  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-30px);
    background: var(--text); color: var(--bg-solid); padding:9px 18px; border-radius:999px;
    font-size:13px; font-weight:600; opacity:0; transition: all .25s ease; z-index:50; pointer-events:none;
    box-shadow: 0 6px 16px rgba(0,0,0,.3);
  }
  .toast.show{ transform:translateX(-50%) translateY(0); opacity:1; }

  /* ---- Settings modal ---- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(10,12,18,.5); backdrop-filter: blur(2px);
    display:none; align-items:center; justify-content:center; z-index:80; padding:16px;
  }
  .modal-backdrop.open{ display:flex; }
  .modal-panel{
    background: var(--panel); border-radius: 18px; padding:18px; max-width:420px; width:100%;
    max-height:85vh; overflow-y:auto; box-shadow: 0 20px 50px rgba(0,0,0,.4);
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .modal-head h2{ margin:0; font-size:16px; font-weight:700; }
  .modal-section{ margin-bottom:16px; }
  .modal-section:last-child{ margin-bottom:0; }
  .modal-section .ctrl-label{ display:block; margin-bottom:7px; text-align:left; }
  .modal-section .chip-group{ justify-content:flex-start; }

  @media (prefers-reduced-motion: reduce){ *{ animation: none !important; transition: none !important; } }

  /* ---- Liquid Glass theme ---- */
  [data-theme="glass"] body{ background: var(--bg-solid); }
  [data-theme="glass"] #app{ position:relative; z-index:1; }
  [data-theme="glass"] body::before, [data-theme="glass"] body::after{
    content:""; position:fixed; inset:-15%; z-index:0; pointer-events:none; will-change:transform;
  }
  /* No filter:blur here — the soft look comes from the gradient's own
     transparent falloff, which costs nothing extra to animate. */
  [data-theme="glass"] body::before{
    background:
      radial-gradient(40% 36% at 20% 20%, rgba(99,132,255,.34), transparent 72%),
      radial-gradient(36% 32% at 85% 75%, rgba(120,200,255,.24), transparent 72%);
    animation: glassdrift1 20s ease-in-out infinite alternate;
  }
  [data-theme="glass"] body::after{
    background: radial-gradient(32% 28% at 70% 15%, rgba(180,150,255,.2), transparent 74%);
    animation: glassdrift2 26s ease-in-out infinite alternate;
  }
  @keyframes glassdrift1{
    0%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(4%,-3%) scale(1.08); }
    100%{ transform: translate(-5%,4%) scale(1.12); }
  }
  @keyframes glassdrift2{
    0%{ transform: translate(0,0) scale(1); }
    100%{ transform: translate(-6%,-4%) scale(1.15); }
  }

  /* Backdrop-filter is kept to only a few large, few-in-number surfaces.
     Every glass surface constantly resamples whatever is moving behind it,
     so the fewer/smaller the filtered surfaces, the smoother the animation
     stays — this is the main lag fix. Small chrome (chips, buttons) gets a
     flat translucent look instead, which is visually indistinguishable at
     that size but effectively free. */
  [data-theme="glass"] .card, [data-theme="glass"] .board-wrap, [data-theme="glass"] .modal-panel{
    background: linear-gradient(150deg, rgba(255,255,255,.14), rgba(255,255,255,.05)) !important;
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(255,255,255,.28);
    position: relative;
  }
  [data-theme="glass"] .chip-group, [data-theme="glass"] .panel-pop, [data-theme="glass"] .icon-btn{
    background: rgba(255,255,255,.12) !important;
    border: 1px solid rgba(255,255,255,.22);
  }
  [data-theme="glass"] .led{
    background: rgba(4,6,14,.5) !important;
    border: 1px solid rgba(255,255,255,.18);
  }
  /* Cells get a cheap solid/gradient look with no backdrop-filter at all:
     with hundreds of cells on a big board, per-cell backdrop-filter was the
     single biggest source of frame lag. */
  [data-theme="glass"] .cell{
    background: linear-gradient(155deg, rgba(255,255,255,.20), rgba(255,255,255,.06));
    border: 1px solid rgba(255,255,255,.20);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -8px 12px -8px rgba(0,0,0,.3);
  }
  [data-theme="glass"] .cell.revealed{ background: linear-gradient(155deg, rgba(255,255,255,.12), rgba(255,255,255,.03)); }
  [data-theme="glass"] .cell.hidden:hover{ background: linear-gradient(155deg, rgba(255,255,255,.28), rgba(255,255,255,.08)); }
  [data-theme="glass"] .chip.active{ background: rgba(255,255,255,.24) !important; }
  [data-theme="glass"] .restart-btn, [data-theme="glass"] .panel-pop button{
    background: color-mix(in srgb, var(--accent) 65%, rgba(255,255,255,.25));
  }
  /* Specular sheen: a soft diagonal light catch, like light grazing a curved surface */
  [data-theme="glass"] .card::after, [data-theme="glass"] .board-wrap::after,
  [data-theme="glass"] .modal-panel::after, [data-theme="glass"] .led::after{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background: linear-gradient(120deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 28%, rgba(255,255,255,0) 72%, rgba(255,255,255,.12) 100%);
    mix-blend-mode: overlay;
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidePanel">
    <div class="titlebar">
      <svg class="brand" viewBox="0 0 24 24" fill="none"><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.5 4.5l3 3M16.5 16.5l3 3M19.5 4.5l-3 3M7.5 16.5l-3 3"/></g><circle cx="12" cy="12" r="6" fill="currentColor"/></svg>
      <h1>Minesweeper</h1>
      <button class="icon-btn" id="settingsBtn" title="Appearance settings" aria-label="Appearance settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.9 7.9 0 0 0 0-2l2-1.5-2-3.4-2.4 1a8 8 0 0 0-1.7-1L15 3.5h-6l-.3 2.6a8 8 0 0 0-1.7 1l-2.4-1-2 3.4L4.6 11a7.9 7.9 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 1.7 1L9 20.5h6l.3-2.6a8 8 0 0 0 1.7-1l2.4 1 2-3.4z"/></svg>
      </button>
    </div>

    <div class="controls">
      <div class="ctrl-block">
        <span class="ctrl-label">Size</span>
        <div class="chip-group" id="sizeGroup" role="group" aria-label="Board size">
          <button class="chip" data-size="small">Small</button>
          <button class="chip" data-size="medium">Medium</button>
          <button class="chip" data-size="large">Large</button>
          <button class="chip" data-size="huge">Huge</button>
          <button class="chip" data-size="custom">Custom</button>
        </div>
      </div>
      <div class="ctrl-block">
        <span class="ctrl-label">Difficulty</span>
        <div class="chip-group" id="diffGroup" role="group" aria-label="Difficulty">
          <button class="chip" data-diff="easy">Easy</button>
          <button class="chip" data-diff="medium">Medium</button>
          <button class="chip" data-diff="hard">Hard</button>
          <button class="chip" data-diff="custom">Custom</button>
        </div>
      </div>
      <div class="ctrl-block">
        <span class="ctrl-label">Tap action</span>
        <div class="chip-group" id="modeGroup" role="group" aria-label="Tap action">
          <button class="chip" data-mode="sweep">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l6-6M13.5 6.5a3 3 0 1 1 4 4L9 19l-5 1 1-5z"/></svg>
            Sweep
          </button>
          <button class="chip" data-mode="flag">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4"/><path d="M6 4h12l-3.2 4L18 12H6"/></svg>
            Flag
          </button>
        </div>
      </div>
    </div>

    <div class="controls">
      <div class="panel-pop" id="customSizePanel">
        <label>Width <input type="number" id="cW" min="5" max="50" value="20"></label>
        <label>Height <input type="number" id="cH" min="5" max="40" value="14"></label>
        <button id="applySize">Apply size</button>
      </div>
      <div class="panel-pop" id="customDiffPanel">
        <label>Mines <input type="number" id="cM" min="1" max="999" value="45"></label>
        <button id="applyDiff">Apply mines</button>
      </div>
    </div>
  </div>

  <div id="playArea">
    <div class="card">
      <div class="hud">
        <div class="led-block">
          <div class="led" id="mineLed"><span class="led-digits" id="mineCount">010</span></div>
          <span class="led-label">Flags left</span>
        </div>
        <button class="smiley-btn" id="smiley" title="New game" aria-label="New game"></button>
        <div class="led-block">
          <div class="led" id="timeLed"><span class="led-digits" id="timeCount">000</span></div>
          <span class="led-label">Time</span>
        </div>
      </div>
      <div class="board-wrap" id="boardWrap">
        <div id="board" class="shape-square"></div>
        <canvas id="particles"></canvas>
      </div>
    </div>

    <div class="below-board">
      <button class="restart-btn" id="restartBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        <span id="restartLabel">Restart</span>
      </button>
      <div class="footer-hint" id="hintText">Tap to sweep · Long-press or right-click to flag · Double-tap a number to auto-clear its safe neighbors</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="settingsModal">
  <div class="modal-panel">
    <div class="modal-head">
      <h2>Appearance</h2>
      <button class="icon-btn" id="closeSettings" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal-section">
      <span class="ctrl-label">Theme</span>
      <div class="chip-group" id="themeGroup" role="group" aria-label="Theme">
        <button class="chip" data-theme-opt="light">Light</button>
        <button class="chip" data-theme-opt="dark">Dark</button>
        <button class="chip" data-theme-opt="catppuccin-latte">Catppuccin Latte</button>
        <button class="chip" data-theme-opt="catppuccin-frappe">Catppuccin Frappé</button>
        <button class="chip" data-theme-opt="catppuccin-macchiato">Catppuccin Macchiato</button>
        <button class="chip" data-theme-opt="catppuccin-mocha">Catppuccin Mocha</button>
        <button class="chip" data-theme-opt="m3">Material 3</button>
        <button class="chip" data-theme-opt="glass">Liquid Glass</button>
        <button class="chip" data-theme-opt="custom">Custom</button>
      </div>
      <div class="panel-pop" id="m3ThemePanel" style="margin-top:8px;">
        <label>Primary <input type="color" id="m3Accent" value="#6750A4"></label>
      </div>
      <div class="panel-pop" id="customThemePanel" style="margin-top:8px;">
        <label>Background <input type="color" id="customBg" value="#232634"></label>
        <label>Accent <input type="color" id="customAccent" value="#5CC8A5"></label>
      </div>
    </div>
    <div class="modal-section">
      <span class="ctrl-label">Tile shape</span>
      <div class="chip-group" id="shapeGroup" role="group" aria-label="Tile shape">
        <button class="chip" data-shape="square">Square</button>
        <button class="chip" data-shape="circle">Circle</button>
        <button class="chip" data-shape="squircle">Squircle</button>
      </div>
    </div>
    <div class="modal-section">
      <span class="ctrl-label">UI scale</span>
      <div class="panel-pop show">
        <label style="flex:1; gap:8px;">
          <input type="range" id="uiScaleRange" min="70" max="150" step="5" value="100">
        </label>
        <span id="uiScaleLabel" style="min-width:38px; text-align:right; font-weight:700;">100%</span>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- Config ----------
  const SIZES = {
    small:  {w:9,  h:9},
    medium: {w:16, h:16},
    large:  {w:24, h:20},
    huge:   {w:30, h:24}
  };
  const DIFFS = { easy:0.12, medium:0.16, hard:0.21 };

  let state = {
    size: 'medium', diff: 'easy', mode: 'sweep',
    cols: 16, rows: 16, mines: 40,
    customCols: 20, customRows: 14, customMinesValue: 45,
    board: [], firstClick: true, gameOver: false, won: false,
    flags: 0, revealedCount: 0, timer: 0, timerHandle: null, cellPx: 28, uiScale: 1,
  };

  const boardEl = document.getElementById('board');
  const boardWrap = document.getElementById('boardWrap');
  const particlesCanvas = document.getElementById('particles');
  const pctx = particlesCanvas.getContext('2d');
  const smiley = document.getElementById('smiley');
  const mineCountEl = document.getElementById('mineCount');
  const timeCountEl = document.getElementById('timeCount');
  const toastEl = document.getElementById('toast');
  const hintText = document.getElementById('hintText');
  const restartBtn = document.getElementById('restartBtn');
  const restartLabel = document.getElementById('restartLabel');

  // ---------- Icons ----------
  const ICON_FLAG = `<svg viewBox="0 0 24 24" fill="none"><path d="M6 21V4" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/><path d="M6 4h11l-2.6 4L17 12H6z" fill="var(--flag-color)"/></svg>`;
  const ICON_MINE = `<svg viewBox="0 0 24 24" fill="none"><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 2.2v3.4M12 18.4v3.4M2.2 12h3.4M18.4 12h3.4M5 5l2.4 2.4M16.6 16.6L19 19M19 5l-2.4 2.4M7.4 16.6L5 19"/></g><circle cx="12" cy="12" r="5.6" fill="currentColor"/><circle cx="10" cy="10" r="1.3" fill="#fff" opacity=".5"/></svg>`;

  function faceSVG(kind){
    const faces = {
      idle: `<circle cx="9" cy="10" r="1.6" fill="var(--face-ink)"/><circle cx="15" cy="10" r="1.6" fill="var(--face-ink)"/><path d="M7.5 14.5c1 1.6 2.7 2.5 4.5 2.5s3.5-.9 4.5-2.5" stroke="var(--face-ink)" stroke-width="1.8" fill="none" stroke-linecap="round"/>`,
      active: `<circle cx="9" cy="10" r="1.9" fill="var(--face-ink)"/><circle cx="15" cy="10" r="1.9" fill="var(--face-ink)"/><circle cx="12" cy="16" r="1.7" fill="var(--face-ink)"/>`,
      win: `<path d="M6 9.5h5v1.6a2.5 2.5 0 0 1-5 0z" fill="var(--face-ink)"/><path d="M13 9.5h5v1.6a2.5 2.5 0 0 1-5 0z" fill="var(--face-ink)"/><path d="M11 10h2" stroke="var(--face-ink)" stroke-width="1.4"/><path d="M7 15c1.6 2 3.2 2.8 5 2.8s3.4-.8 5-2.8" stroke="var(--face-ink)" stroke-width="1.8" fill="none" stroke-linecap="round"/>`,
      dead: `<path d="M7.3 8.3l3.4 3.4M10.7 8.3L7.3 11.7" stroke="var(--face-ink)" stroke-width="1.8" stroke-linecap="round"/><path d="M13.3 8.3l3.4 3.4M16.7 8.3l-3.4 3.4" stroke="var(--face-ink)" stroke-width="1.8" stroke-linecap="round"/><path d="M8 16.5c1.2-1.3 2.6-2 4-2s2.8.7 4 2" stroke="var(--face-ink)" stroke-width="1.8" fill="none" stroke-linecap="round"/>`
    };
    return `<svg viewBox="0 0 24 24">${faces[kind]||faces.idle}</svg>`;
  }
  function setSmiley(kind){ smiley.innerHTML = faceSVG(kind); }

  // ---------- Audio ----------
  let actx = null;
  function ac(){
    if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    return actx;
  }
  function softTone(freq, dur, vol, delay, type){
    const c = ac(); const t0 = c.currentTime + (delay||0);
    const osc = c.createOscillator(); osc.type = type||'sine';
    osc.frequency.setValueAtTime(freq, t0);
    const filt = c.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value = Math.max(freq*2.2, 800);
    const gain = c.createGain();
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    osc.connect(filt).connect(gain).connect(c.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function noiseBurst(dur, vol, delay, freqStart, freqEnd){
    const c = ac(); const t0 = c.currentTime + (delay||0);
    const n = Math.floor(c.sampleRate*dur);
    const buf = c.createBuffer(1,n,c.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, 1.6);
    const src = c.createBufferSource(); src.buffer = buf;
    const filt = c.createBiquadFilter(); filt.type='bandpass';
    filt.frequency.setValueAtTime(freqStart||1800, t0);
    if(freqEnd) filt.frequency.exponentialRampToValueAtTime(freqEnd, t0+dur);
    filt.Q.value = 0.8;
    const gain = c.createGain(); gain.gain.setValueAtTime(vol, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0+dur);
    src.connect(filt).connect(gain).connect(c.destination);
    src.start(t0);
  }
  function sndClick(){ noiseBurst(0.035, .10, 0, 2600, 1200); softTone(220, .05, .03, 0.002); }
  function sndReveal(i){ noiseBurst(0.03, .06, i*0.014, 2400, 1400); }
  function sndFlag(){ softTone(660, .09, .09, 0, 'triangle'); softTone(880, .1, .06, .05, 'triangle'); }
  function sndUnflag(){ softTone(520, .09, .07, 0, 'triangle'); softTone(400, .1, .05, .05, 'triangle'); }
  function sndChordBad(){ softTone(150, .16, .07, 0, 'sine'); }
  function sndExplosion(){
    const c = ac();
    const n = Math.floor(c.sampleRate*0.55);
    const buf = c.createBuffer(1,n,c.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, 2.2);
    const src = c.createBufferSource(); src.buffer = buf;
    const filt = c.createBiquadFilter(); filt.type='lowpass';
    filt.frequency.setValueAtTime(900, c.currentTime);
    filt.frequency.exponentialRampToValueAtTime(60, c.currentTime + .5);
    const gain = c.createGain(); gain.gain.setValueAtTime(.28, c.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + .55);
    src.connect(filt).connect(gain).connect(c.destination);
    src.start();
    softTone(70, .4, .16, 0, 'sine');
  }
  function sndWin(){
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f,i)=>{
      softTone(f, .5, .07, i*0.13, 'sine');
      softTone(f*1.005, .5, .04, i*0.13, 'triangle');
    });
  }

  // ---------- Particles ----------
  let particles = [];
  function spawnParticles(x, y, count, opts){
    opts = opts || {};
    for(let i=0;i<count;i++){
      const angle = opts.angle!==undefined ? opts.angle + (Math.random()-.5)*(opts.spread||6.28) : Math.random()*6.28;
      const speed = (opts.speedMin||1) + Math.random()*((opts.speedMax||4)-(opts.speedMin||1));
      particles.push({
        x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed - (opts.upBias||0),
        life: (opts.life||600) + Math.random()*200, age: 0,
        size: (opts.size||3) + Math.random()*(opts.sizeVar||2),
        color: opts.colors ? opts.colors[Math.floor(Math.random()*opts.colors.length)] : '#888',
        gravity: opts.gravity!==undefined ? opts.gravity : 0.12,
        shape: opts.shape || 'circle', rot: Math.random()*6.28, vrot: (Math.random()-.5)*0.3,
        fade: opts.fade!==false
      });
    }
  }
  let lastT = performance.now();
  function animateParticles(t){
    const dt = Math.min(32, t - lastT); lastT = t;
    pctx.clearRect(0,0,particlesCanvas.width, particlesCanvas.height);
    const dpr = window.devicePixelRatio || 1;
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i]; p.age += dt;
      if(p.age > p.life){ particles.splice(i,1); continue; }
      p.vy += p.gravity; p.x += p.vx; p.y += p.vy; p.rot += p.vrot;
      const lifeRatio = 1 - p.age/p.life;
      pctx.save();
      pctx.globalAlpha = p.fade ? Math.max(0,lifeRatio) : 1;
      pctx.translate(p.x*dpr, p.y*dpr); pctx.rotate(p.rot);
      pctx.fillStyle = p.color;
      const s = p.size*dpr;
      if(p.shape==='rect'){ pctx.fillRect(-s/2,-s/2,s,s*.6); }
      else { pctx.beginPath(); pctx.arc(0,0,s/2,0,6.28); pctx.fill(); }
      pctx.restore();
    }
    requestAnimationFrame(animateParticles);
  }
  requestAnimationFrame(animateParticles);
  function resizeParticleCanvas(){
    const dpr = window.devicePixelRatio || 1;
    const r = boardWrap.getBoundingClientRect();
    particlesCanvas.width = Math.round(r.width*dpr);
    particlesCanvas.height = Math.round(r.height*dpr);
    particlesCanvas.style.width = r.width+'px';
    particlesCanvas.style.height = r.height+'px';
  }

  // ---------- Toast ----------
  let toastTimer=null;
  function toast(msg){
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 1600);
  }

  // ---------- Game logic ----------
  function idx(r,c){ return r*state.cols + c; }
  function inBounds(r,c){ return r>=0 && r<state.rows && c>=0 && c<state.cols; }
  function neighbors(r,c){
    const res=[];
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      if(dr===0 && dc===0) continue;
      if(inBounds(r+dr,c+dc)) res.push([r+dr,c+dc]);
    }
    return res;
  }
  function buildEmptyBoard(){
    state.board = [];
    for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++)
      state.board.push({mine:false, revealed:false, flagged:false, adj:0, exploded:false});
  }
  function placeMines(excludeR, excludeC){
    const forbidden = new Set();
    forbidden.add(idx(excludeR,excludeC));
    neighbors(excludeR,excludeC).forEach(([r,c])=> forbidden.add(idx(r,c)));
    let placed = 0; const total = state.cols*state.rows;
    const maxMines = Math.min(state.mines, total - forbidden.size);
    while(placed < maxMines){
      const i = Math.floor(Math.random()*total);
      if(forbidden.has(i) || state.board[i].mine) continue;
      state.board[i].mine = true; placed++;
    }
    state.mines = placed;
    for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){
      if(state.board[idx(r,c)].mine) continue;
      let n=0; neighbors(r,c).forEach(([nr,nc])=>{ if(state.board[idx(nr,nc)].mine) n++; });
      state.board[idx(r,c)].adj = n;
    }
  }
  function setDims(){
    if(state.size === 'custom'){ state.cols = state.customCols; state.rows = state.customRows; }
    else { const s = SIZES[state.size]; state.cols = s.w; state.rows = s.h; }
    if(state.diff === 'custom'){
      state.mines = Math.max(1, Math.min(state.customMinesValue, state.cols*state.rows - 9));
    } else {
      state.mines = Math.max(1, Math.round(state.cols*state.rows*DIFFS[state.diff]));
    }
  }
  function newGame(){
    setDims(); stopTimer();
    state.timer = 0; state.firstClick = true; state.gameOver = false; state.won = false;
    state.flags = 0; state.revealedCount = 0; particles = [];
    restartBtn.classList.remove('show');
    buildEmptyBoard(); updateHud(); setSmiley('idle'); renderBoard(); layoutBoard();
  }
  function updateHud(){
    const left = state.mines - state.flags;
    mineCountEl.textContent = formatLed(left, 3);
    timeCountEl.textContent = formatLed(state.timer, 3);
  }
  function formatLed(n, width){
    const neg = n < 0;
    let s = Math.min(Math.abs(n), Math.pow(10,width)-1).toString().padStart(width - (neg?1:0), '0');
    return neg ? '-'+s : s;
  }
  function startTimer(){
    if(state.timerHandle) return;
    state.timerHandle = setInterval(()=>{ state.timer++; updateHud(); }, 1000);
  }
  function stopTimer(){ if(state.timerHandle){ clearInterval(state.timerHandle); state.timerHandle = null; } }

  // ---------- Rendering ----------
  function renderBoard(){
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = `repeat(${state.cols}, var(--cs))`;
    boardEl.style.gridTemplateRows = `repeat(${state.rows}, var(--cs))`;
    const frag = document.createDocumentFragment();
    for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){
      const cell = document.createElement('div');
      cell.className = 'cell hidden';
      cell.dataset.r = r; cell.dataset.c = c;
      frag.appendChild(cell);
      state.board[idx(r,c)].el = cell;
    }
    boardEl.appendChild(frag);
  }
  const rowLayoutQuery = window.matchMedia('(min-width: 860px) and (min-aspect-ratio: 4/5)');
  const sidePanelEl = document.getElementById('sidePanel');
  function doLayoutPass(){
    const scale = state.uiScale || 1;
    const hudH = document.querySelector('.hud').offsetHeight;
    const belowH = document.querySelector('.below-board').offsetHeight;
    const cardPad = 20;
    let availH, availW;
    if(rowLayoutQuery.matches){
      // Side-by-side layout: controls sit beside the board, not above it,
      // so only the HUD/board-chrome height competes for vertical space.
      availH = (window.innerHeight - hudH - belowH - cardPad - 10) / scale;
      availW = (window.innerWidth - sidePanelEl.offsetWidth - 24 - 32) / scale;
    } else {
      const headerH = document.querySelector('.titlebar').offsetHeight;
      const controlsEls = document.querySelectorAll('.controls');
      let controlsH = 0; controlsEls.forEach(el=> controlsH += el.offsetHeight);
      const vGaps = 6*4;
      availH = (window.innerHeight - headerH - controlsH - hudH - belowH - cardPad - vGaps - 10) / scale;
      availW = (window.innerWidth - 20) / scale;
    }
    let cs = Math.floor(Math.min(availW/state.cols, availH/state.rows));
    cs = Math.max(12, Math.min(cs, 84));
    state.cellPx = cs;
    boardEl.style.setProperty('--cs', cs+'px');
    // Size the grid and its wrapper exactly to the content so overflow:hidden
    // never clips a partial row/column of cells (matters most for circular tiles).
    const totalW = state.cols*cs + (state.cols-1);
    const totalH = state.rows*cs + (state.rows-1);
    boardEl.style.width = totalW+'px';
    boardEl.style.height = totalH+'px';
    boardWrap.style.width = totalW+'px';
    boardWrap.style.height = totalH+'px';
    document.querySelectorAll('.cell').forEach(el=>{ el.style.fontSize = Math.max(9, cs*0.46)+'px'; });
    // Scale the surrounding chrome (card padding, HUD, LEDs, smiley) with the
    // cell size so a small board doesn't look lost inside oversized chrome,
    // and a huge board's chrome doesn't dwarf its tiny cells.
    const elemScale = Math.max(0.75, Math.min(1.5, cs/28));
    document.documentElement.style.setProperty('--ui-elem-scale', elemScale.toFixed(3));
    requestAnimationFrame(resizeParticleCanvas);
  }
  function layoutBoard(){
    doLayoutPass();
    // A second pass refines the fit once the chrome has actually resized
    // from the elemScale change applied in the first pass.
    requestAnimationFrame(doLayoutPass);
  }
  function cellCenterPx(r,c){
    const rect = boardWrap.getBoundingClientRect();
    const bx = boardEl.getBoundingClientRect();
    return { x: (bx.left - rect.left) + c*state.cellPx + state.cellPx/2, y: (bx.top - rect.top) + r*state.cellPx + state.cellPx/2 };
  }
  function numberSpan(n){ return `<span class="num n${n}">${n}</span>`; }
  function drawCell(r,c){
    const cell = state.board[idx(r,c)]; const el = cell.el;
    el.className = 'cell'; el.innerHTML = '';
    if(cell.revealed){
      el.classList.add('revealed');
      if(cell.mine){ el.classList.add('mine-hit'); el.innerHTML = ICON_MINE; }
      else if(cell.adj>0){ el.innerHTML = numberSpan(cell.adj); }
    } else if(cell.flagged){
      el.classList.add('hidden','flagged'); el.innerHTML = ICON_FLAG;
      if(state.gameOver && !cell.mine) el.classList.add('wrong-flag');
    } else {
      el.classList.add('hidden');
      if(state.gameOver && cell.mine) el.innerHTML = ICON_MINE;
    }
  }

  // ---------- Reveal / flood fill ----------
  function revealCell(r, c, chain){
    const cell = state.board[idx(r,c)];
    if(cell.revealed || cell.flagged) return;
    cell.revealed = true; state.revealedCount++; drawCell(r,c);
    if(!chain){
      const p = cellCenterPx(r,c);
      spawnParticles(p.x, p.y, 4, {colors:['#C3CBD7','#EEF1F6'], life:260, size:2.5, sizeVar:1.5, speedMin:.3, speedMax:1.3, gravity:.02, fade:true});
    }
    if(cell.mine){ cell.exploded = true; drawCell(r,c); triggerLoss(r,c); return true; }
    if(cell.adj === 0){
      let n = 0;
      neighbors(r,c).forEach(([nr,nc])=>{
        const nc_ = state.board[idx(nr,nc)];
        if(!nc_.revealed && !nc_.flagged){
          setTimeout(()=>{ if(!state.gameOver) { revealCell(nr,nc,true); sndReveal(n); } }, n*10);
          n++;
        }
      });
    }
    return false;
  }
  function floodFrom(r,c){
    const hitMine = revealCell(r,c,false);
    if(hitMine) return;
    sndClick(); checkWin();
  }
  function revealAllMines(){
    for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){
      const cell = state.board[idx(r,c)];
      if(cell.mine && !cell.revealed) cell.revealed = true;
      drawCell(r,c);
    }
  }
  function triggerLoss(r,c){
    state.gameOver = true; stopTimer(); setSmiley('dead');
    boardWrap.classList.add('shake');
    setTimeout(()=> boardWrap.classList.remove('shake'), 460);
    sndExplosion();
    const p = cellCenterPx(r,c);
    spawnParticles(p.x, p.y, 34, {colors:['#EA4335','#FF9800','#5F6368','#2B3242'], life:700, size:4, sizeVar:3, speedMin:2, speedMax:7, gravity:.18});
    revealAllMines();
    toast('Boom. Try again!');
    restartLabel.textContent = 'Restart';
    restartBtn.classList.add('show');
  }
  function checkWin(){
    const total = state.cols*state.rows;
    if(state.revealedCount === total - state.mines){
      state.gameOver = true; state.won = true; stopTimer(); setSmiley('win'); sndWin(); celebrate();
      for(let r=0;r<state.rows;r++) for(let c=0;c<state.cols;c++){
        const cell = state.board[idx(r,c)];
        if(cell.mine && !cell.flagged){ cell.flagged = true; state.flags++; drawCell(r,c); }
      }
      updateHud(); toast('You win!');
      restartLabel.textContent = 'Play again';
      restartBtn.classList.add('show');
    }
  }
  function celebrate(){
    const rect = boardWrap.getBoundingClientRect();
    const cs = getComputedStyle(document.documentElement);
    const palette = ['--n1','--n2','--n3','--n4','--flag-color'].map(v=>cs.getPropertyValue(v).trim());
    let bursts = 0;
    const iv = setInterval(()=>{
      spawnParticles(Math.random()*rect.width, -6, 10, { colors:palette, life:1400, size:5, sizeVar:3, speedMin:.5, speedMax:2, angle: 1.57, spread:1.2, gravity:.08, shape:'rect' });
      bursts++; if(bursts>18) clearInterval(iv);
    }, 90);
  }
  function setFlag(r,c,value){
    const cell = state.board[idx(r,c)];
    if(cell.revealed || state.gameOver) return;
    if(cell.flagged === value) return;
    if(value && state.flags >= state.mines){ sndChordBad(); toast('No more flags left'); return; }
    cell.flagged = value; state.flags += value ? 1 : -1; drawCell(r,c);
    if(value) sndFlag(); else sndUnflag();
    updateHud();
    if(navigator.vibrate) navigator.vibrate(12);
  }
  function toggleFlag(r,c){ setFlag(r,c, !state.board[idx(r,c)].flagged); }
  function chordReveal(r,c){
    const cell = state.board[idx(r,c)];
    if(!cell.revealed || cell.adj===0) return;
    const ns = neighbors(r,c);
    const flagged = ns.filter(([nr,nc])=> state.board[idx(nr,nc)].flagged).length;
    if(flagged !== cell.adj){ sndChordBad(); return; }
    let hitMine = false, n=0;
    ns.forEach(([nr,nc])=>{
      const ncell = state.board[idx(nr,nc)];
      if(!ncell.flagged && !ncell.revealed){
        const h = revealCell(nr,nc,true);
        if(h) hitMine = true; else sndReveal(n);
        n++;
      }
    });
    if(!hitMine) checkWin();
  }
  function firstClickGuard(r,c){
    if(state.firstClick){ placeMines(r,c); state.firstClick = false; startTimer(); updateHud(); }
  }
  function primaryAction(r,c){
    const cell = state.board[idx(r,c)];
    if(state.mode === 'flag'){
      if(cell.revealed) return;
      firstClickGuard(r,c); toggleFlag(r,c);
    } else {
      if(cell.flagged || cell.revealed) return;
      firstClickGuard(r,c); floodFrom(r,c);
    }
  }
  function secondaryAction(r,c){
    const cell = state.board[idx(r,c)];
    if(state.mode === 'flag'){
      if(cell.flagged || cell.revealed) return;
      firstClickGuard(r,c); floodFrom(r,c);
    } else {
      if(cell.revealed) return;
      firstClickGuard(r,c); toggleFlag(r,c);
    }
  }

  // ---------- Input handling ----------
  let pressTimer = null, longPressed = false, downPos = null;
  let lastTapInfo = {r:-1,c:-1,t:0};
  const LONG_PRESS_MS = 420, MOVE_TOLERANCE = 10;
  function cellFromEvent(e){
    const target = e.target.closest('.cell'); if(!target) return null;
    return { r: parseInt(target.dataset.r), c: parseInt(target.dataset.c) };
  }
  boardEl.addEventListener('contextmenu', e=> e.preventDefault());
  boardEl.addEventListener('pointerdown', (e)=>{
    if(state.gameOver) return;
    const info = cellFromEvent(e); if(!info) return;
    downPos = {x:e.clientX, y:e.clientY}; longPressed = false; setSmiley('active');
    if(e.pointerType === 'mouse' && e.button === 2){ secondaryAction(info.r, info.c); return; }
    pressTimer = setTimeout(()=>{ longPressed = true; secondaryAction(info.r, info.c); }, LONG_PRESS_MS);
  }, {passive:true});
  boardEl.addEventListener('pointermove', (e)=>{
    if(!downPos) return;
    const dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
    if(Math.sqrt(dx*dx+dy*dy) > MOVE_TOLERANCE) clearTimeout(pressTimer);
  }, {passive:true});
  function endPress(){ clearTimeout(pressTimer); if(!state.gameOver) setSmiley('idle'); downPos = null; }
  boardEl.addEventListener('pointerup', (e)=>{
    if(state.gameOver){ endPress(); return; }
    const info = cellFromEvent(e); endPress(); if(!info) return;
    if(longPressed){ longPressed = false; return; }
    if(e.pointerType === 'mouse' && e.button === 2) return;
    const cell = state.board[idx(info.r, info.c)];
    const now = Date.now();
    const isDoubleTap = (lastTapInfo.r===info.r && lastTapInfo.c===info.c && (now-lastTapInfo.t) < 320);
    lastTapInfo = {r:info.r, c:info.c, t:now};
    if(cell.revealed){ if(isDoubleTap || e.detail === 2) chordReveal(info.r, info.c); return; }
    primaryAction(info.r, info.c);
  });
  boardEl.addEventListener('pointercancel', endPress);
  boardEl.addEventListener('pointerleave', (e)=>{ if(e.target===boardEl) clearTimeout(pressTimer); });
  boardEl.addEventListener('mousedown', (e)=>{
    if(e.buttons === 3 || e.button === 1){
      const info = cellFromEvent(e);
      if(info && !state.gameOver){ e.preventDefault(); chordReveal(info.r, info.c); }
    }
  });

  // ---------- Settings modal ----------
  const settingsModal = document.getElementById('settingsModal');
  document.getElementById('settingsBtn').addEventListener('click', ()=> settingsModal.classList.add('open'));
  document.getElementById('closeSettings').addEventListener('click', ()=> settingsModal.classList.remove('open'));
  settingsModal.addEventListener('click', (e)=>{ if(e.target === settingsModal) settingsModal.classList.remove('open'); });

  // ---------- Theme ----------
  const customThemePanel = document.getElementById('customThemePanel');
  const m3ThemePanel = document.getElementById('m3ThemePanel');
  function luminance(hex){
    const c = hex.replace('#','');
    const r = parseInt(c.substr(0,2),16)/255, g = parseInt(c.substr(2,2),16)/255, b = parseInt(c.substr(4,2),16)/255;
    return 0.299*r + 0.587*g + 0.114*b;
  }
  function updateSurfaceMode(){
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-solid').trim();
    const isDark = bg.startsWith('#') ? luminance(bg) < 0.5 : true;
    document.documentElement.classList.toggle('is-dark', isDark);
  }
  // The smiley button's face is drawn on top of --flag-color, not the page
  // background, so its ink color must be derived from --flag-color specifically
  // (a theme with a light flag-color needs a dark face and vice versa).
  function updateFaceInk(){
    let flag = getComputedStyle(document.documentElement).getPropertyValue('--flag-color').trim();
    if(!/^#([0-9a-f]{6})$/i.test(flag)) flag = '#F0A93B';
    const ink = luminance(flag) > 0.55 ? '#1E222B' : '#F5F5F7';
    document.documentElement.style.setProperty('--face-ink', ink);
  }
  function applyCustomTheme(){
    const bg = document.getElementById('customBg').value;
    const accent = document.getElementById('customAccent').value;
    const text = luminance(bg) > 0.55 ? '#1E222B' : '#F2F4F8';
    const muted = luminance(bg) > 0.55 ? '#5A6472' : '#9BA3B3';
    const root = document.documentElement.style;
    root.setProperty('--bg-solid', bg);
    root.setProperty('--accent', accent);
    root.setProperty('--text', text);
    root.setProperty('--muted', muted);
    root.setProperty('--flag-color', accent);
    updateSurfaceMode();
    updateFaceInk();
  }
  function applyM3Accent(){
    document.documentElement.style.setProperty('--accent', document.getElementById('m3Accent').value);
  }
  document.getElementById('customBg').addEventListener('input', applyCustomTheme);
  document.getElementById('customAccent').addEventListener('input', applyCustomTheme);
  document.getElementById('m3Accent').addEventListener('input', applyM3Accent);
  document.getElementById('themeGroup').addEventListener('click', (e)=>{
    const b = e.target.closest('.chip'); if(!b) return;
    const t = b.dataset.themeOpt;
    document.querySelectorAll('#themeGroup .chip').forEach(x=> x.classList.toggle('active', x===b));
    document.documentElement.style.cssText = document.documentElement.style.cssText
      .replace(/--bg-solid:[^;]+;?/,'').replace(/--accent:[^;]+;?/,'').replace(/--text:[^;]+;?/,'').replace(/--muted:[^;]+;?/,'').replace(/--flag-color:[^;]+;?/,'');
    document.documentElement.setAttribute('data-theme', t);
    customThemePanel.classList.toggle('show', t==='custom');
    m3ThemePanel.classList.toggle('show', t==='m3');
    if(t==='custom') applyCustomTheme();
    if(t==='m3') applyM3Accent();
    updateSurfaceMode();
    updateFaceInk();
    setSmiley(state.gameOver ? (state.won?'win':'dead') : (document.activeElement===boardEl?'active':'idle'));
  });

  // ---------- Tile shape ----------
  document.getElementById('shapeGroup').addEventListener('click', (e)=>{
    const b = e.target.closest('.chip'); if(!b) return;
    document.querySelectorAll('#shapeGroup .chip').forEach(x=> x.classList.toggle('active', x===b));
    boardEl.className = 'shape-' + b.dataset.shape;
  });

  // ---------- Size / difficulty ----------
  const customSizePanel = document.getElementById('customSizePanel');
  const customDiffPanel = document.getElementById('customDiffPanel');
  function setActiveChip(group, attr, value){
    document.querySelectorAll(`#${group} .chip`).forEach(b=> b.classList.toggle('active', b.dataset[attr] === value));
  }
  document.getElementById('sizeGroup').addEventListener('click', (e)=>{
    const b = e.target.closest('.chip'); if(!b) return;
    state.size = b.dataset.size;
    setActiveChip('sizeGroup','size', state.size);
    customSizePanel.classList.toggle('show', state.size === 'custom');
    if(state.size !== 'custom') newGame();
  });
  document.getElementById('applySize').addEventListener('click', ()=>{
    const w = Math.max(5, Math.min(50, parseInt(document.getElementById('cW').value)||20));
    const h = Math.max(5, Math.min(40, parseInt(document.getElementById('cH').value)||14));
    document.getElementById('cW').value = w; document.getElementById('cH').value = h;
    state.customCols = w; state.customRows = h;
    newGame();
  });
  document.getElementById('diffGroup').addEventListener('click', (e)=>{
    const b = e.target.closest('.chip'); if(!b) return;
    state.diff = b.dataset.diff;
    setActiveChip('diffGroup','diff', state.diff);
    customDiffPanel.classList.toggle('show', state.diff === 'custom');
    if(state.diff !== 'custom') newGame();
  });
  document.getElementById('applyDiff').addEventListener('click', ()=>{
    const cols = state.size==='custom' ? state.customCols : SIZES[state.size].w;
    const rows = state.size==='custom' ? state.customRows : SIZES[state.size].h;
    const maxM = cols*rows - 9;
    const m = Math.max(1, Math.min(maxM, parseInt(document.getElementById('cM').value)||10));
    document.getElementById('cM').value = m;
    state.customMinesValue = m;
    newGame();
  });

  // ---------- Tap mode ----------
  document.getElementById('modeGroup').addEventListener('click', (e)=>{
    const b = e.target.closest('.chip'); if(!b) return;
    state.mode = b.dataset.mode;
    setActiveChip('modeGroup','mode', state.mode);
    hintText.textContent = state.mode === 'flag'
      ? 'Tap to flag · Long-press or right-click to sweep · Double-tap a number to auto-clear its safe neighbors'
      : 'Tap to sweep · Long-press or right-click to flag · Double-tap a number to auto-clear its safe neighbors';
  });

  smiley.addEventListener('click', ()=>{
    smiley.classList.remove('pulse'); void smiley.offsetWidth; smiley.classList.add('pulse');
    newGame();
  });
  restartBtn.addEventListener('click', newGame);
  window.addEventListener('resize', ()=>{ layoutBoard(); });

  // ---------- UI scale ----------
  const uiScaleRange = document.getElementById('uiScaleRange');
  const uiScaleLabel = document.getElementById('uiScaleLabel');
  uiScaleRange.addEventListener('input', ()=>{
    const v = parseInt(uiScaleRange.value);
    uiScaleLabel.textContent = v+'%';
    state.uiScale = v/100;
    document.documentElement.style.setProperty('--ui-scale', state.uiScale);
    layoutBoard();
  });

  // ---------- init ----------
  document.querySelector('#themeGroup [data-theme-opt="light"]').classList.add('active');
  setActiveChip('sizeGroup','size','medium');
  setActiveChip('diffGroup','diff','easy');
  setActiveChip('modeGroup','mode','sweep');
  document.querySelector('#shapeGroup [data-shape="square"]').classList.add('active');
  updateSurfaceMode();
  updateFaceInk();
  newGame();
})();
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(()=>{});
    });
  }
</script>
</body>
</html>
